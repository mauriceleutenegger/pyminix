# Run the test suite on every push and pull request.
# The tests use a fake transport and the simulator; no hardware is needed.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}   # login shell, so the micromamba environment is active
    steps:
      - uses: actions/checkout@v4

      # Libraries Qt needs even when drawing offscreen.
      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install the package
        run: pip install --no-deps --no-build-isolation -e .

      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
