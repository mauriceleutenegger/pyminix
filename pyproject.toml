[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minix"
version = "0.1.0"
description = "Control GUI for the Amptek Mini-X X-ray tube controller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyftdi>=0.55",
    "PySide6>=6.8",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/minix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
