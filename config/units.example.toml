# Mini-X unit configuration.
#
# Copy to ~/.config/minix/units.toml or config/units.toml (checked in that
# order).
#
# An OEM controller (MX50, MX50.10, MX70) states its model, and with it the
# power rating and voltage range, on two strapping pins (§2.2), so no entry
# is needed here. A non-OEM Mini-X controller does not, and then watt_max_w
# is REQUIRED: 4.0 or 10.0, from the unit's label or documentation (§6.1.1).
# If you are unsure, use 4.0: over-stating the rating permits over-driving
# the tube; under-stating it only costs flux.
#
# An entry is also a cross-check: if it disagrees with the controller, the
# LOWER of the two is used and a warning is logged.

[units."01300036"]
watt_max_w = 10.0
source     = "hardware documentation, verified 2026-08-13"

[safety]
safety_margin_w     = 0.050  # absolute, as in the reference (§6.1.1)
interlock_clear_s   = 3.0    # before controls re-enable; reference: 3 cycles of its 1 s loop (§7.3)
monx_timeout_s      = 1.0    # tube-ready (MONX) must assert within this after the ramp (§7.2)
monx_warning_s      = 1.0    # warn if MONX stays low this long with HV on; shorter
                             # drops are only counted (they are common near 200 µA, §10.8)
range_tolerance     = 0.10   # out-of-range indicator band, plus a fixed 1.0 (§6.4)
hv_off_test_delay_s = 7.0    # after HV on/off, before HV-off readings are tested (§6.4)

[polling]
gpio_hz    = 10.0   # interlock, MONX, enable readback
adc_hz     = 2.0    # HV and current monitors
temp_hz    = 0.2    # DS1722; 12-bit conversion is slow
display_hz = 1.0

[logging]
directory = "~/minix_logs"   # run records and the application log; relative paths
                             # are relative to this file
sample_hz = 1.0              # run-record rows per second (plus one per state change)
