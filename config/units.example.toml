# Mini-X unit configuration.
#
# Copy to config/units.toml or ~/.config/minix/units.toml.
#
# watt_max_w is REQUIRED per unit and must be 4.0 or 10.0, taken from the
# unit's hardware documentation. It cannot be read from the device (§2.1).
# If you are unsure, use 4.0: over-stating the rating permits over-driving
# the tube; under-stating it only costs flux (§6.1.1).

[units."01300036"]
watt_max_w = 10.0
source     = "hardware documentation, verified 2026-08-13"
# hv_max_kv and hv_factor are derived from the serial number (§2.1).
# Override only with a documented reason.

[safety]
safety_margin_w    = 0.050  # absolute, as in the reference (§6.1.1)
interlock_clear_s  = 3.0    # before controls re-enable; reference: 3 cycles of its 1 s loop (§7.3)
monx_timeout_s     = 1.0    # tube-ready must assert within this after enabling (§7.2)
tol_coarse         = 0.10   # range-check tolerances (§6.4)
tol_fine           = 0.05

[polling]
gpio_hz    = 10.0   # interlock, MONX, enable readback
adc_hz     = 2.0    # HV and current monitors
temp_hz    = 0.2    # DS1722; 12-bit conversion is slow
display_hz = 1.0
